# codex-sandbox configuration.
# Default location: ${XDG_CONFIG_HOME:-$HOME/.config}/agent-controls/sandbox.conf
# Override with CODEX_SANDBOX_CONFIG. One entry per line; # starts a comment.
# Paths are absolute or start with ~/ and must not contain spaces.
#
#   rw <path>                 working root, bound read-write
#   ro <path>                 working root, bound read-only
#   ro <path> <subtree>...    only the listed subtrees are bound, read-only;
#                             .git is absent, so `codex exec` gets
#                             --skip-git-repo-check
#   tool <path>               read-only bind present in every session
#   state <path>              read-write bind present in every session,
#                             created when missing
#   setenv <NAME> <value>     set a variable for Codex (~/ is expanded)
#   unsetenv <NAME>           remove a variable from Codex's environment
#   mask <glob>               extra file name pattern overmounted with
#                             /dev/null; .env* is always masked
#
# Codex runs only when the current directory is inside a root. When roots
# nest, the longest match wins, and only that root is bound.

# Working roots
rw ~/src/my-app
ro ~/src/vendor-library
ro ~/src/governed-repo docs src tools

# The Codex install (here an nvm Node prefix) and the binaries it calls
tool ~/.nvm/versions/node/v24.0.0
tool ~/.local/bin/uv

# Codex state, and a cache that Codex does not share with other tools
state ~/.codex
state ~/.cache/uv-codex
setenv UV_CACHE_DIR ~/.cache/uv-codex

# Credentials that the parent shell may export. CLAUDE_CODE_OAUTH_TOKEN is set
# by claude_profile and reaches Codex when Claude Code starts it.
unsetenv CLAUDE_CODE_OAUTH_TOKEN
unsetenv AWS_SECRET_ACCESS_KEY
unsetenv GH_TOKEN

# Further secret file patterns
mask *.pem
mask credentials.json
